<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NCITIS’26 App</title>
<meta name="description" content="Official app of NCITIS’26, the Second National Conference on Information Technology and Intelligent Systems, University of Batna 2, 13–14 December 2026.">
<meta name="theme-color" content="#0b1f40">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NCITIS’26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<header class="topbar" id="topbar">
  <button class="icon-btn back" id="back-btn" type="button" aria-label="Back" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <a class="brand" href="#/home" aria-label="NCITIS’26 home">
    <span class="brand-logos"><img src="../assets/logo-univ-batna2.png" alt="" width="22" height="32"><img src="../assets/logo-faculte-mi.png" alt="" width="29" height="32"></span>
    <span class="brand-word">NCITIS<span>’26</span></span>
  </a>
  <span class="offline-pill" id="offline-pill" hidden>Offline</span>
  <button class="icon-btn" id="share-btn" type="button" aria-label="Share the conference">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>
  </button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" aria-label="Main">
  <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
  <a href="#/tracks" data-tab="tracks"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>Tracks</span></a>
  <a href="#/dates" data-tab="dates"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Dates</span></a>
  <a href="#/submit" data-tab="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4 15v3.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V15"/></svg><span>Submit</span></a>
  <a href="#/more" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg><span>More</span></a>
</nav>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-handle" aria-hidden="true"></div>
  <h2 id="sheet-title"></h2>
  <div id="sheet-body"></div>
  <button class="btn btn-navy btn-block" id="sheet-close" type="button">Got it</button>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<form id="overleaf-form" action="https://www.overleaf.com/docs" method="post" target="_blank" hidden>
  <input type="hidden" name="snip_uri" id="snip-uri" value="">
  <input type="hidden" name="snip_name" value="NCITIS26 extended abstract">
</form>

<noscript><p class="noscript">This app needs JavaScript. You can also visit the conference page: <a href="../index.html">NCITIS’26 website</a>.</p></noscript>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
